---

- name: Cleanup defaults
  hosts: localhost
  vars:
    miniconda_prefix: "{{ lookup('env', 'TRAVIS_BUILD_DIR') | default('/tmp', true) }}/conda/default"
  tasks:
    - name: Cleanup conda prefix directory
      ansible.builtin.file:
        path: "{{ miniconda_prefix }}"
        state: absent

- name: Cleanup miniforge
